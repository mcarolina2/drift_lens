name: Data Drift Detection

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

jobs:
  detect-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Detectar Data Drift
        id: drift
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python src/drift_metrics.py \
            --reference data/reference/train_data.csv \
            --production data/production/serving_data.csv \
            --output drift_report.json
        continue-on-error: true
      - name: Commit drift report
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add drift_report.json
          git commit -m "Atualiza relatório de drift" || echo "Nada para commitar"
          git push